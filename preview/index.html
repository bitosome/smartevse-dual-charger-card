<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartEVSE Flow Card Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --primary-text-color: #f3f4f6;
        --secondary-text-color: #9ca3af;
        --error-color: #ef4444;
        --card-background-color: #171717;
        --ha-card-background: #171717;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.14), transparent 26%),
          radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.12), transparent 30%),
          #0b0d12;
        color: var(--primary-text-color);
      }

      button,
      select {
        font: inherit;
      }

      .app {
        max-width: 1440px;
        margin: 0 auto;
        padding: 18px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .toolbar-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .surface {
        display: grid;
        grid-template-columns: minmax(320px, auto) minmax(260px, 340px);
        gap: 18px;
        align-items: start;
      }

      .frame {
        width: 390px;
        max-width: 100%;
        transition: width 140ms ease;
      }

      .panel {
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(23, 23, 23, 0.84);
        padding: 14px;
        backdrop-filter: blur(10px);
      }

      .panel h1,
      .panel h2 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
      }

      .control {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(255, 255, 255, 0.04);
        color: var(--primary-text-color);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .control.active {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.12);
      }

      .control.select {
        min-width: 220px;
      }

      .hint {
        color: var(--secondary-text-color);
        font-size: 12px;
        line-height: 1.45;
      }

      .log {
        margin-top: 12px;
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: var(--secondary-text-color);
        font-size: 12px;
        line-height: 1.5;
        min-height: 120px;
        white-space: pre-wrap;
      }

      ha-card {
        display: block;
      }

      ha-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1em;
        height: 1em;
      }

      @media (max-width: 980px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .surface {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <div class="toolbar-group panel">
          <select id="scenario" class="control select">
            <option value="schedule_waiting">Schedule Waiting</option>
            <option value="charging_left" selected>Charging Left</option>
            <option value="charging_right">Charging Right</option>
            <option value="price_waiting">Price Waiting</option>
            <option value="timer_active">Timer Active</option>
            <option value="both_idle">Both Idle</option>
            <option value="unknown_ev">Unknown EV</option>
          </select>
        </div>
        <div class="toolbar-group panel">
          <button class="control active" data-width="390">Mobile</button>
          <button class="control" data-width="680">Tablet</button>
          <button class="control" data-width="960">Wide</button>
        </div>
        <div class="toolbar-group panel">
          <button class="control" id="reset">Reset Scenario</button>
        </div>
      </div>

      <div class="surface">
        <div class="frame" id="frame"></div>

        <div class="panel">
          <h1>Preview Notes</h1>
          <div class="hint">
            This page renders the real custom card with mock Home Assistant state.
            Toggle tiles call mock Home Assistant services. Setting tiles open inline
            editors in the card and apply changes immediately to the mock state.
          </div>

          <h2 style="margin-top: 14px;">Interaction Log</h2>
          <div class="log" id="log">Ready.</div>
        </div>
      </div>
    </div>

    <script>
      if (!customElements.get("ha-card")) {
        customElements.define("ha-card", class extends HTMLElement {});
      }

      if (!customElements.get("ha-icon")) {
        customElements.define(
          "ha-icon",
          class extends HTMLElement {
            static get observedAttributes() {
              return ["icon"];
            }

            connectedCallback() {
              this.render();
            }

            attributeChangedCallback() {
              this.render();
            }

            render() {
              const icon = this.getAttribute("icon") || "";
              const map = {
                "mdi:calendar-clock": "🗓",
                "mdi:lightning-bolt": "⚡",
                "mdi:currency-eur": "€",
                "mdi:timer-sand": "⏳",
                "mdi:source-fork": "⇄",
                "mdi:cash-edit": "¤",
                "mdi:clock-time-four-outline": "🕒",
                "mdi:swap-horizontal-bold": "⇆",
              };
              this.textContent = map[icon] || "•";
              this.title = icon;
            }
          },
        );
      }
    </script>

      function entity(state, attributes = {}) {
        return { state: String(state), attributes };
      }

      function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function hydrateControllerScenario(snapshot) {
        const controller = snapshot[controllerEntity];
        if (!controller) {
          return snapshot;
        }
        const attrs = controller.attributes || {};
        for (const key of ["smartevse_1", "smartevse_2"]) {
          const nameKey = `${key}_name`;
          const connectedKey = `${key}_connected_ev`;
          const batteryKey = `${key}_battery`;
          const plugKey = `${key}_plug_state`;
          if (!(connectedKey in attrs)) {
            attrs[connectedKey] =
              attrs[plugKey] === "Connected" ? String(attrs[nameKey] || "?") : "unknown";
          }
          if (!(batteryKey in attrs)) {
            attrs[batteryKey] = "n/a";
          }
        }
        const acceptablePrice = snapshot["number.smartevse_dual_charger_acceptable_price"];
        if (acceptablePrice) {
          acceptablePrice.attributes = {
            ...(acceptablePrice.attributes || {}),
            min: 0,
            max: 1,
            step: 0.001,
            unit_of_measurement: "EUR/kWh",
          };
        }
        const dutyCycle = snapshot["number.smartevse_dual_charger_duty_cycle"];
        if (dutyCycle) {
          dutyCycle.attributes = {
            ...(dutyCycle.attributes || {}),
            min: 5,
            max: 720,
            step: 5,
            unit_of_measurement: "min",
          };
        }
        const forceDuration = snapshot["number.smartevse_dual_charger_force_charge_duration"];
        if (forceDuration) {
          forceDuration.attributes = {
            ...(forceDuration.attributes || {}),
            min: 5,
            max: 720,
            step: 5,
            unit_of_measurement: "min",
          };
        }
        const chargePolicy = snapshot["select.smartevse_dual_charger_charge_policy"];
        if (chargePolicy) {
          const smartevse1 = String(attrs.smartevse_1_name || "SmartEVSE 1");
          const smartevse2 = String(attrs.smartevse_2_name || "SmartEVSE 2");
          chargePolicy.attributes = {
            ...(chargePolicy.attributes || {}),
            options: [
              `${smartevse1} first`,
              `${smartevse2} first`,
              `${smartevse1} only`,
              `${smartevse2} only`,
            ],
          };
        }
        controller.attributes = attrs;
        return snapshot;
      }

      function makeHass() {
        return {
          states,
          callService(domain, service, data) {
            appendLog(`${domain}.${service} → ${data.entity_id}`);
            if (domain === "homeassistant" && iconToggles.has(data.entity_id)) {
              const next = service === "turn_on" ? "on" : "off";
              states[data.entity_id].state = next;
            } else if (domain === "select" && service === "select_option" && states[data.entity_id]) {
              states[data.entity_id].state = String(data.option ?? "");
            } else if (
              (domain === "number" || domain === "input_number") &&
              service === "set_value" &&
              states[data.entity_id]
            ) {
              states[data.entity_id].state = String(data.value ?? "");
            } else if (domain === "text" && service === "set_value" && states[data.entity_id]) {
              states[data.entity_id].state = String(data.value ?? "");
            } else if (domain === "time" && service === "set_value" && states[data.entity_id]) {
              states[data.entity_id].state = String(data.time ?? "");
            }
            if (card) {
              card.hass = makeHass();
            }
            return Promise.resolve();
          },
        };
      }

      function appendLog(message) {
        const stamp = new Date().toLocaleTimeString();
        log.textContent = `[${stamp}] ${message}\n` + log.textContent;
      }

      function renderCard() {
        frame.innerHTML = "";
        card = document.createElement("smartevse-flow-card");
        card.setConfig({
          controller_entity: controllerEntity,
          price_entity: "sensor.real_electricity_price_current_price",
          schedule_entity: "schedule.charge_schedule",
          schedule_switch_entity: "switch.smartevse_dual_charger_charge_with_schedule",
          force_charge_entity: "switch.smartevse_dual_charger_force_charge",
          force_price_entity: "switch.smartevse_dual_charger_force_charge_by_price",
          force_timer_entity: "switch.smartevse_dual_charger_force_charge_timer",
          acceptable_price_entity: "number.smartevse_dual_charger_acceptable_price",
          charge_policy_entity: "select.smartevse_dual_charger_charge_policy",
          duty_cycle_entity: "number.smartevse_dual_charger_duty_cycle",
          force_charge_duration_entity: "number.smartevse_dual_charger_force_charge_duration",
          duty_remaining_entity: "sensor.smartevse_dual_charger_duty_cycle_remaining",
          timer_remaining_entity: "sensor.smartevse_dual_charger_timer_remaining",
        });
        card.hass = makeHass();
        frame.appendChild(card);
      }

      function resetScenario(name) {
        currentScenario = name;
        states = hydrateControllerScenario(deepClone(scenarios[name]));
        renderCard();
        appendLog(`Scenario reset → ${name}`);
      }

      function setWidth(width) {
        frame.style.width = `${width}px`;
        widthButtons.forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.width) === width);
        });
        appendLog(`Preview width → ${width}px`);
      }

      scenarioSelect.addEventListener("change", () => resetScenario(scenarioSelect.value));
      resetButton.addEventListener("click", () => resetScenario(currentScenario));
      widthButtons.forEach((button) => {
        button.addEventListener("click", () => setWidth(Number(button.dataset.width)));
      });

      setWidth(390);
      renderCard();
    </script>
  </body>
</html>
